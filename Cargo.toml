[package]
name = "easycompositing"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/easyocr/easycompositing"
description = "One API for window control across compositors (X11, wlroots-based Wayland) — write it once, not once per compositor"

[features]
default = ["x11", "wayland"]
x11 = ["dep:x11rb"]
wayland = ["dep:wayland-client", "dep:wayland-protocols-wlr"]

[dependencies]
thiserror = "1"
x11rb = { version = "0.14", optional = true }
wayland-client = { version = "0.31", optional = true }
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
