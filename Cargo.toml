[package]
name = "not-enough-compositors"
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/easyocr/not-enough-compositors"
description = "One API for window control across compositors (X11, Hyprland, wlroots-based Wayland) — write it once, not once per compositor"

[lib]
name = "nec"

[features]
# NOTE: "niri" is intentionally NOT in default — see its entry below.
default = ["x11", "wayland", "hyprland"]
x11 = ["dep:x11rb"]
wayland = [
    "dep:wayland-client",
    "dep:wayland-protocols-wlr",
    "dep:wayland-protocols",
    "dep:wayland-protocols-plasma",
]
# Hyprland's own hyprctl socket IPC — not a Wayland protocol, so it has no
# dependency on the "wayland" feature above and works even without it.
hyprland = ["dep:serde", "dep:serde_json"]
# niri's own JSON IPC, via niri's official niri-ipc crate. Opt-in, not part
# of default: niri-ipc is GPL-3.0-or-later, unlike everything else this
# crate depends on (MIT/Apache-2.0), and pulling in a GPL dependency by
# default without the consuming project asking for it isn't something this
# crate should decide on your behalf. Enable it explicitly if that's fine
# for your project.
niri = ["dep:niri-ipc"]

[dependencies]
thiserror = "1"
x11rb = { version = "0.14", optional = true }
wayland-client = { version = "0.31", optional = true }
# wlr-foreign-toplevel-management: wlroots-based compositors (Sway, Wayfire,
# river, dwl, Hyprland, and similar all implement this the same way).
wayland-protocols-wlr = { version = "0.3", features = ["client"], optional = true }
# ext-foreign-toplevel-list-v1: the newer standardized, list-only protocol
# some non-wlroots compositors (recent Mutter/KWin) implement.
wayland-protocols = { version = "0.32", features = ["client", "staging"], optional = true }
# org_kde_plasma_window_management: KWin's own protocol, gives full
# list/focus/close on KDE Plasma when nothing else has already bound it.
wayland-protocols-plasma = { version = "0.3", features = ["client"], optional = true }
# hyprctl's -j output is JSON.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# niri's official IPC types + a blocking Unix-socket client. GPL-3.0-or-later
# — see the "niri" feature comment above.
niri-ipc = { version = "26", optional = true }
