name: CI

on:
  push:
    branches: [main, InDev]
  pull_request:
    branches: [main, InDev]
  workflow_dispatch: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - --all-features
          - --no-default-features --features x11
          - --no-default-features --features wayland
          - --no-default-features --features hyprland
          - --no-default-features --features niri
          - --no-default-features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system Wayland/X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb1-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets ${{ matrix.features }} -- -D warnings

  build-and-test:
    name: build + test (${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features:
          - --all-features
          - "" # default features
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system Wayland/X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb1-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --all-targets ${{ matrix.features }}
      - run: cargo test ${{ matrix.features }}

  doc:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system Wayland/X11 dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxcb1-dev libwayland-dev libxkbcommon-dev pkg-config
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings
